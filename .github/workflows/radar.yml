name: 案件雷達

on:
  schedule:
    # 台灣時間 = UTC+8
    - cron: '30 20 * * *'                        # 04:30 完整更新（全平台＋同體系 7 店＋實登）
    - cron: '0 23,1,3,5,7,9,11,13,15 * * *'      # 07:00–23:00 每 2 小時快速更新（591）
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick 或 full'
        default: 'quick'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 取回追蹤狀態（data 分支）
        run: |
          if git ls-remote --exit-code origin data >/dev/null; then
            git fetch --depth 1 origin data
            mkdir -p state && git --work-tree=state checkout origin/data -- . && git reset -q
          else
            echo "第一次執行，沒有 data 分支"
          fi
          ls -la state || true

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 執行雷達
        env:
          EXCLUDED_STORES: ${{ secrets.EXCLUDED_STORES }}
          RADAR_MODE: ${{ (github.event.schedule == '30 20 * * *' || inputs.mode == 'full') && 'full' || 'quick' }}
        run: node run.js

      - name: 存回追蹤狀態（只留一個 commit）
        run: |
          cd state
          git init -q -b data
          git config user.name radar-bot
          git config user.email radar-bot@users.noreply.github.com
          git add -A && git commit -qm "state $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
