name: 案件雷達

on:
  schedule:
    # 台灣時間 = UTC+8
    - cron: '30 20 * * *'                        # 04:30 完整更新（全平台＋同體系店家＋實登）
    - cron: '0 23,1,3,5,7,9,11,13,15 * * *'      # 07:00–23:00 每 2 小時快速更新（591 增量＋全市關鍵字）
    - cron: '0 12 * * *'                         # 20:00 快速更新＋LINE 晚上收尾（tools/notify.js PUSH_END）
  workflow_dispatch:
    inputs:
      mode:
        description: 'quick 或 full'
        default: 'quick'

permissions:
  contents: read

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      RADAR_URL: ${{ secrets.RADAR_URL }}
      INGEST_KEY: ${{ secrets.INGEST_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 追蹤狀態與結果都存在 Cloudflare（要登入才看得到），不放在公開的 GitHub
      - name: 取回追蹤狀態
        run: node tools/sync.js pull

      - name: 執行雷達
        env:
          EXCLUDED_STORES: ${{ secrets.EXCLUDED_STORES }}
          RADAR_SKIP: '5168'   # 5168 擋海外 IP（tools/probe-sites.js 實測 403）
          RADAR_MODE: ${{ (github.event.schedule == '30 20 * * *' || inputs.mode == 'full') && 'full' || 'quick' }}
        run: node run.js

      # 案件地址的路名 → 地圖座標（查過的不再查；LINE「附近」「開車5分鐘」與地圖用）
      - name: 路名座標
        env:
          RADAR_MODE: ${{ (github.event.schedule == '30 20 * * *' || inputs.mode == 'full') && 'full' || 'quick' }}
        run: node tools/roads.js

      # 新的好案＋客戶新配對 → 寫網站＋合併一則 LINE（沒設 LINE_TOKEN 就只寫網站）
      - name: 新案件／新配對提醒
        env:
          LINE_TOKEN: ${{ secrets.LINE_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: node tools/notify.js

      # LINE 對話查詢用的每區精簡索引（官方帳號打「東區優質透天」就從這裡篩）
      - name: LINE 查詢索引
        run: node tools/line-index.js

      - name: 上傳到網站
        run: node tools/sync.js push
