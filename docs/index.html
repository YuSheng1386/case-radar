<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>案件雷達</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mut:#6b6a66;--line:#e4e2dc;--acc:#b4441f;--hot:#c0392b;--own:#1f6f8b;--down:#7a5b00;--low:#2e7d32;--blk:#8a8a8a;--chip:#efede7}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--mut:#a3a29c;--line:#33322f;--acc:#e07a52;--hot:#ef6b5b;--own:#5fb4d0;--down:#d9b23c;--low:#6cc070;--blk:#777;--chip:#2a2a27}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 8px}
h1{font-size:18px;margin:0;display:flex;align-items:baseline;gap:8px}
h1 small{font-size:12px;color:var(--mut);font-weight:400}
.bar{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row2{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--mut)}
select,input[type=search]{font:inherit;font-size:13px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 6px}
input[type=search]{flex:1;min-width:120px}
main{max-width:860px;margin:0 auto;padding:10px 16px 60px}
.stat{font-size:12px;color:var(--mut);margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;display:grid;grid-template-columns:96px 1fr;gap:12px}
.card.blocked{opacity:.55}
.card img{width:96px;height:72px;object-fit:cover;border-radius:6px;background:var(--chip)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ttl{font-weight:600;font-size:14px;word-break:break-all}
.score{flex:none;font-size:12px;font-weight:700;color:var(--acc);border:1.5px solid var(--acc);border-radius:6px;padding:0 6px}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;color:#fff;background:var(--mut)}
.t-急售,.t-賠售{background:var(--hot)}.t-自售{background:var(--own)}.t-降價{background:var(--down)}.t-標低於行情,.t-超值{background:var(--low)}.t-低於實登{background:var(--low);outline:1.5px solid var(--low);outline-offset:1px}.t-新{background:var(--acc)}.t-同體系{background:var(--blk)}
.price{font-size:17px;font-weight:700}
.price s{font-size:12px;color:var(--mut);font-weight:400;margin-left:4px}
.meta{font-size:12.5px;color:var(--mut)}
.mk{font-size:12.5px}
.mk b.lo{color:var(--low)}.mk b.hi{color:var(--hot)}
.srcs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.srcs a{font-size:12px;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:5px;padding:1px 7px}
.why{font-size:11.5px;color:var(--mut);margin-top:4px}
.blk{font-size:12px;color:var(--hot);margin-top:4px}
.blk a{color:inherit}
.mk a{color:inherit}
.who{font-size:12px;padding:1px 7px;border-radius:5px;background:var(--chip);color:var(--mut)}
.who.own{color:var(--own);font-weight:600}.who.many{color:var(--hot)}
.more{width:100%;font-size:12px}.more summary{cursor:pointer;color:var(--mut)}.more a{display:inline-block;margin:4px 6px 0 0}
.blkbox{margin-top:18px;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.blkbox summary{cursor:pointer;color:var(--mut)}
.blkrow{padding:6px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.blkrow a{color:var(--mut);font-size:12px}
.empty{color:var(--mut);text-align:center;padding:40px 0}
@media (max-width:480px){.card{grid-template-columns:72px 1fr;gap:10px}.card img{width:72px;height:56px}}
</style>
</head>
<body>
<header>
  <h1>案件雷達 <small id="upd">載入中…</small></h1>
  <div class="bar" id="tagbar"></div>
  <div class="row2">
    <select id="scope">
      <option value="">全台中</option>
      <option value="main">主力五區</option>
      <option value="wide">五區以外（只看關鍵字案）</option>
    </select>
    <select id="dist"><option value="">全部區域</option></select>
    <select id="sort">
      <option value="score">依分數</option>
      <option value="new">依上架時間</option>
      <option value="drop">依降幅</option>
      <option value="mk">依低於行情</option>
    </select>
    <input type="search" id="q" placeholder="搜尋社區／路名／標題">
  </div>
</header>
<main>
  <div class="stat" id="stat"></div>
  <div id="list"></div>
</main>
<script>
const TAGS = ['全部', '新上架', '低於實登', '賠售', '標低於行情', '急售', '超值', '自售', '降價'];
let data = null, tag = '全部';
const $ = id => document.getElementById(id);
const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
const ago = iso => { if (!iso) return '—'; const m = (Date.now() - Date.parse(iso)) / 6e4;
  return m < 60 ? `${Math.round(m)} 分鐘前` : m < 1440 ? `${Math.round(m / 60)} 小時前` : `${Math.round(m / 1440)} 天前`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function render() {
  const d = $('dist').value, scope = $('scope').value, q = $('q').value.trim(), sort = $('sort').value;
  let cs = data.cards.filter(c =>
    (!d || c.district === d) &&
    (!scope || (scope === 'wide') === !!c.wide) &&
    (tag === '全部' || (tag === '新上架' ? c.isNew : c.tags.includes(tag))) &&
    (!q || [c.title, c.community, c.address].join(' ').includes(q)));
  const key = { score: c => -c.score, new: c => -Date.parse(c.firstSeen), drop: c => -c.drop,
    mk: c => c.comm ? c.comm.diff : c.market ? c.market.diff + 100 : 999 }[sort];
  cs.sort((a, b) => key(a) - key(b));
  $('stat').textContent = `顯示 ${cs.length} 筆｜可開發 ${data.totals.hot}｜同體系已有、排除 ${data.totals.blocked}｜追蹤中 ${data.totals.groups} 案`;
  $('list').innerHTML = (cs.length ? cs.slice(0, 300).map(card).join('') : '<div class="empty">沒有符合的案件</div>') + blockedList(d, scope);
}

// 同體系已有：不能開發。摺疊列出，只為了人工抽查有沒有比對錯
function blockedList(d, scope) {
  const bs = (data.blocked || []).filter(b => (!d || b.district === d) &&
    (!scope || (scope === 'wide') === !(data.districts || []).includes(b.district)));
  if (!bs.length) return '';
  return `<details class="blkbox"><summary>同體系已有・不可開發（${bs.length}）— 點開抽查比對對不對</summary>
    ${bs.map(b => `<div class="blkrow"><b>${esc(b.title || b.community || b.address)}</b>
      <span class="meta">${esc(b.district)}｜${b.price ?? '—'} 萬｜${b.area ?? '—'} 坪｜${esc(b.floor || '—')}｜${b.storeCount} 店｜可信度 ${b.level}</span>
      <a href="${esc(b.url)}" target="_blank" rel="noopener">刊登</a> <a href="${esc(b.ycUrl)}" target="_blank" rel="noopener">永慶</a></div>`).join('')}
  </details>`;
}

function card(c) {
  const tags = (c.isNew ? ['新'] : []).concat(c.tags);
  const hi = Math.max(...c.sources.flatMap(s => (s.hist || []).map(h => h[1])), c.price || 0);
  const sign = v => `${v > 0 ? '+' : ''}${v}%`;
  // 同社區實登（含車位口徑，與刊登單價可直接比）優先；沒有才用同區相近物件（已扣車位，刊登含車位會偏高）
  const mk = c.comm
    ? `<div class="mk">開價 ${c.unitPrice} 萬/坪 vs <a href="${esc(c.comm.url)}" target="_blank" rel="noopener">同社區</a>近3年成交中位 ${c.comm.med}（${c.comm.n} 筆，最低 ${c.comm.min}）→ <b class="${c.comm.diff < 0 ? 'lo' : 'hi'}">${sign(c.comm.diff)}</b>${c.comm.belowMin ? ' <b class="lo">低於最低成交</b>' : ''}</div>`
    : c.market ? `<div class="mk">實登${c.market.level === 'similar' ? '相近物件' : '同區'}中位 ${c.market.median} 萬/坪（${c.market.n} 筆），本案 ${c.unitPrice ?? '—'} → <b class="${c.market.diff < 0 ? 'lo' : 'hi'}">${sign(c.market.diff)}</b> <span class="meta">（實登已扣車位，僅供參考）</span></div>` : '';
  return `<div class="card${c.sameSystem ? ' blocked' : ''}">
    <img loading="lazy" src="${esc(c.photo)}" alt="" onerror="this.style.visibility='hidden'">
    <div>
      <div class="top"><div class="ttl">${esc(c.title || c.community || c.address)}</div><div class="score">${c.score}</div></div>
      <div class="tags">${tags.map(t => `<span class="tag t-${t}">${t}</span>`).join('')}</div>
      <div class="price">${c.price ?? '—'} 萬${hi > c.price ? `<s>${hi} 萬</s>` : ''} <span class="meta">${c.drop ? `降 ${c.drop}%` : ''}</span></div>
      <div class="meta">${esc(c.district)}｜${esc(c.community || c.address)}｜${c.area ?? '—'} 坪｜${esc(c.floor || '—')}｜${c.age != null && c.age !== '' ? esc(c.age) + (String(c.age).includes('年') ? '' : ' 年') : '屋齡—'}｜${esc(c.layout || c.type || '')}</div>
      ${mk}
      <div class="srcs">${srcLinks(c)}</div>
      <div class="why">首次看到 ${ago(c.firstSeen)}｜${esc(c.why.join('、'))}</div>
    </div></div>`;
}

// 同一戶常被很多仲介重複刊登：最便宜的先列，最多 4 個連結，其餘摺疊
function srcLinks(c) {
  const p = c.posters || { total: c.sources.length, agents: 0, owner: false };
  const who = p.owner && p.agents === 0 ? '<span class="who own">只有屋主自己在賣</span>'
    : `<span class="who${p.agents >= 5 ? ' many' : ''}">${p.owner ? '屋主＋' : ''}${p.agents} 位仲介在刊</span>`;
  const link = s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.s)} ${s.price ?? ''}${s.agent ? '・' + esc(s.agent.replace(/^仲介/, '')) : ''}</a>`;
  const ss = c.sources.slice().sort((a, b) => (a.price || 1e9) - (b.price || 1e9));
  const more = ss.length > 4 ? `<details class="more"><summary>其他 ${ss.length - 4} 筆</summary>${ss.slice(4).map(link).join('')}</details>` : '';
  return who + ss.slice(0, 4).map(link).join('') + more;
}

$('tagbar').innerHTML = TAGS.map(t => `<button class="chip${t === tag ? ' on' : ''}" data-t="${t}">${t}</button>`).join('');
$('tagbar').onclick = e => { const t = e.target.dataset.t; if (!t) return; tag = t;
  [...$('tagbar').children].forEach(b => b.classList.toggle('on', b.dataset.t === t)); render(); };
['scope', 'dist', 'sort'].forEach(id => $(id).onchange = render);
$('q').oninput = render;

fetch('data.json?t=' + Date.now()).then(r => r.json()).then(j => {
  data = j;
  $('upd').textContent = `更新 ${ago(j.generatedAt)}・同體系清單 ${ago(j.sameSystem.at)}`;
  // 主力五區排前面，其他區依案件數
  const cnt = {};
  j.cards.forEach(c => { if (c.district) cnt[c.district] = (cnt[c.district] || 0) + 1; });
  const main = (j.districts || []).filter(d => cnt[d]);
  const rest = Object.keys(cnt).filter(d => !main.includes(d)).sort((a, b) => cnt[b] - cnt[a]);
  $('dist').innerHTML += [...main, ...rest].map(d => `<option value="${esc(d)}">${esc(d)}（${cnt[d]}）</option>`).join('');
  render();
}).catch(e => { $('list').innerHTML = `<div class="empty">資料讀取失敗：${esc(e.message)}</div>`; });
</script>
</body>
</html>
